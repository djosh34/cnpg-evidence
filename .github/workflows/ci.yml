name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # One job per part of the scripts, so they run side by side.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        part: [evidence, host-check, prove, desired, lib]
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          bash --version
          jq --version
          openssl version
          python3 --version
          yq --version
      - name: Script tests
        env:
          PART: ${{ matrix.part }}
        run: bash scripts/test.sh "$PART"

  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          docker --version
          python3 --version
          yq --version
      - name: Monitoring rules
        run: bash samples/monitoring/check.sh

  # host-check.sh on a k3s node in docker: only the known failures of a
  # container node, which docs/host-check.md lists.
  host-check-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A static bash for the node
        run: sudo apt-get install -y -qq bash-static
      - name: Tool versions
        run: |
          set -euo pipefail
          docker --version
          jq --version
          /bin/bash-static --version | head -1
      - name: host-check on a container node
        run: bash live/host-check.sh

  live-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: live/client/go.mod
          cache-dependency-path: live/client/go.sum
      - name: Vet and build the live scenarios' client
        working-directory: live/client
        run: |
          set -euo pipefail
          go version
          go vet ./...
          go build -o /dev/null .

  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          node --version
          jq --version
          openssl version
      - name: Page tests
        working-directory: report
        run: node --test test/*.test.js

  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          docker --version
          jq --version
          file --version
      - name: Build cnpg-report
        run: bash report/build.sh build/cnpg-report
      - name: One static x86_64 file
        run: |
          set -euo pipefail
          file build/cnpg-report
          file build/cnpg-report | grep -q 'x86-64.*statically linked'
      - name: Render in ubi9-minimal without network
        run: bash report/test/binary.sh build/cnpg-report images
      # The container example of docs/report.md, on an image built as the
      # release builds it.
      - name: Run the container example
        run: |
          set -euo pipefail
          mkdir -p image
          cp build/cnpg-report image/cnpg-report
          printf 'FROM scratch\nCOPY cnpg-report /cnpg-report\n' > image/Containerfile
          docker build --platform linux/amd64 --file image/Containerfile --tag ghcr.io/djosh34/cnpg-report:ci image
          bash report/test/docker-example.sh ci docker-example
      - name: Trace summary
        if: ${{ !cancelled() }}
        run: cat images/strace-summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-images
          path: images/
          if-no-files-found: error
      # A release pushes this binary, the one the steps above tested.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: cnpg-report
          path: build/cnpg-report
          retention-days: 1
          if-no-files-found: error
