# RBAC for the barman-cloud plugin in the cnpg-plugin-barman-cloud values chart.
# Subject: ServiceAccount barman-cloud-plugin-barman-cloud in cnpg-system (chart release "barman-cloud").
# Rules copied from the plugin-barman-cloud chart, secrets cut to read; compare with the chart's RBAC on upgrades.
# The plugin watches only the namespaces of WATCH_NAMESPACE in values.yaml, so
# it needs no right outside them. The chart still renders its leader-election
# Role in cnpg-system, the plugin's own namespace.

# The database namespace. Add one Role and RoleBinding like these per extra
# entry in WATCH_NAMESPACE.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: barman-cloud
  namespace: databases
rules:
  # Read only. The plugin grants each instance read on its object store Secret,
  # and Kubernetes lets it grant only what it holds itself.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores/finalizers]
    verbs: [update]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores/status]
    verbs: [get, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/finalizers]
    verbs: [update]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: barman-cloud
  namespace: databases
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: barman-cloud}
subjects:
  - {kind: ServiceAccount, name: barman-cloud-plugin-barman-cloud, namespace: cnpg-system}
