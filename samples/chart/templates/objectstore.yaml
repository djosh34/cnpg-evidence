{{- $c := .Values.cluster }}
# Where barman-cloud writes WAL and base backups, under <destinationPath>/<cluster name>/.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-store
  namespace: {{ $c.namespace }}
spec:
  configuration:
    destinationPath: {{ .Values.objectStore.destinationPath }}
    endpointURL: {{ .Values.objectStore.endpointURL }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.objectStore.credentialsSecret }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.objectStore.credentialsSecret }}
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      archiveAdditionalCommandArgs: ["--read-timeout={{ .Values.objectStore.readTimeout }}"]
      restoreAdditionalCommandArgs: ["--read-timeout={{ .Values.objectStore.readTimeout }}"]
  # The environment of barman-cloud in each instance's sidecar.
  instanceSidecarConfiguration:
    env:
      - name: AWS_MAX_ATTEMPTS
        value: {{ .Values.objectStore.maxAttempts | quote }}
