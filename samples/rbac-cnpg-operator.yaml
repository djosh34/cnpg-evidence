# RBAC for the CNPG operator, used with values-cnpg-operator.yaml.
# Subject: ServiceAccount cnpg-cloudnative-pg in cnpg-system (chart release "cnpg").
# Rules copied from chart cloudnative-pg 0.29.1; compare with the chart's RBAC on upgrades.
# Secrets, pods/exec and the rest are granted only in cnpg-system and databases.

# Cluster-scoped objects only: nodes, webhook configurations, cluster image catalogs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-operator-cluster
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusterimagecatalogs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-operator-cluster
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cnpg-operator-cluster}
subjects:
  - {kind: ServiceAccount, name: cnpg-cloudnative-pg, namespace: cnpg-system}
---
# Namespaced rules. A ClusterRole only so both RoleBindings below can share it;
# it grants nothing until bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-operator-namespaced
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [configmaps/status, secrets/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, pods, pods/exec]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, list, update, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, clusters, databaseroles, databases, poolers, publications, scheduledbackups, subscriptions]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [failoverquorums]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups/status, databases/status, publications/status, scheduledbackups/status, subscriptions/status]
    verbs: [get, patch, update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [imagecatalogs]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/finalizers, databaseroles/finalizers, poolers/finalizers]
    verbs: [update]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters/status, databaseroles/status, poolers/status, failoverquorums/status]
    verbs: [get, patch, update, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, patch, watch]
---
# Own namespace: leader lease, config, webhook and plugin certificates.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-operator
  namespace: cnpg-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cnpg-operator-namespaced}
subjects:
  - {kind: ServiceAccount, name: cnpg-cloudnative-pg, namespace: cnpg-system}
---
# The database namespace. Add one of these per extra entry in WATCH_NAMESPACE.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-operator
  namespace: databases
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cnpg-operator-namespaced}
subjects:
  - {kind: ServiceAccount, name: cnpg-cloudnative-pg, namespace: cnpg-system}
