# k3s's Traefik as a DaemonSet, one pod per node. Put this file into
# /var/lib/rancher/k3s/server/manifests/ on every server; k3s merges these
# values into its own Traefik HelmChart.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
