name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # One job per part of the scripts, so they run side by side.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        part: [evidence, host-check, prove, desired, lib]
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          bash --version
          jq --version
          openssl version
          python3 --version
          yq --version
      - name: Script tests
        env:
          PART: ${{ matrix.part }}
        run: bash scripts/test.sh "$PART"

  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          docker --version
          python3 --version
          yq --version
      - name: Monitoring rules
        run: bash samples/monitoring/check.sh

  # golangci-lint on the root module, with the release binary checked by its
  # SHA-256. golangci-lint cannot turn off nolint comments, so a step fails
  # on any.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: golangci-lint v2.15.0
        run: |
          set -euo pipefail
          v=2.15.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz"
          echo "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  golangci-lint-$v-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "golangci-lint-$v-linux-amd64.tar.gz"
          mv "golangci-lint-$v-linux-amd64/golangci-lint" golangci-lint
          go version
          ./golangci-lint version
      - name: No nolint in the root module
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          while IFS= read -r dir; do
            files+=("$dir"/*.go)
          done < <(go list -f '{{.Dir}}' ./...)
          status=0
          grep -in nolint -- "${files[@]}" || status=$?
          if ((status == 0)); then
            echo "lint: nolint comments are not allowed" >&2
            exit 1
          fi
          if ((status != 1)); then
            exit "$status"
          fi
      - name: Lint
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/golangci-lint" config verify
          "$RUNNER_TEMP/golangci-lint" run ./...

  # The e2e runner and its client (e2e/): vet, tests, among them that each
  # scenario has its own tag and is in e2e.yml, golangci-lint v2.15.0 with no
  # nolint comment, and shellcheck on its scripts and e2e.sh.
  e2e-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: golangci-lint v2.15.0
        run: |
          set -euo pipefail
          v=2.15.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz"
          echo "9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  golangci-lint-$v-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "golangci-lint-$v-linux-amd64.tar.gz"
          mv "golangci-lint-$v-linux-amd64/golangci-lint" golangci-lint
          go version
          ./golangci-lint version
          shellcheck --version
      - name: Vet and test
        working-directory: e2e
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
      - name: No nolint in e2e/
        run: |
          set -euo pipefail
          status=0
          grep -rin --include='*.go' nolint e2e || status=$?
          if ((status == 0)); then
            echo "lint: nolint comments are not allowed" >&2
            exit 1
          fi
          if ((status != 1)); then
            exit "$status"
          fi
      - name: Lint
        working-directory: e2e
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/golangci-lint" config verify
          "$RUNNER_TEMP/golangci-lint" run ./...
      - name: shellcheck
        run: shellcheck e2e.sh e2e/*.sh

  # pgfallback against PostgreSQL 18 in docker: a primary and three standbys,
  # behind TCP proxies the tests stop and start.
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Tool versions
        run: |
          set -euo pipefail
          go version
          docker --version
          openssl version
      - name: pgfallback tests
        run: go test -race ./pgfallback/...

  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          node --version
          jq --version
          openssl version
      - name: Page tests
        working-directory: report
        run: node --test test/*.test.js

  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          set -euo pipefail
          docker --version
          jq --version
          file --version
      - name: Build cnpg-report
        run: bash report/build.sh build/cnpg-report
      - name: One static x86_64 file
        run: |
          set -euo pipefail
          file build/cnpg-report
          file build/cnpg-report | grep -q 'x86-64.*statically linked'
      - name: Render in ubi9-minimal without network
        run: bash report/test/binary.sh build/cnpg-report images
      # The container example of docs/report.md, on an image built as the
      # release builds it.
      - name: Run the container example
        run: |
          set -euo pipefail
          mkdir -p image
          cp build/cnpg-report image/cnpg-report
          printf 'FROM scratch\nCOPY cnpg-report /cnpg-report\n' > image/Containerfile
          docker build --platform linux/amd64 --file image/Containerfile --tag ghcr.io/djosh34/cnpg-report:ci image
          bash report/test/docker-example.sh ci docker-example
      - name: Trace summary
        if: ${{ !cancelled() }}
        run: cat images/strace-summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: report-images
          path: images/
          if-no-files-found: error
      # A release pushes this binary, the one the steps above tested.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: cnpg-report
          path: build/cnpg-report
          retention-days: 1
          if-no-files-found: error
