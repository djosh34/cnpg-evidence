# Chart-only settings. The cluster, CA Secret, LoadBalancers, namespaces,
# replication and databases come from desired.yaml. The values below are
# examples.

cluster:
  # Red Hat's Hummingbird PostgreSQL image, pinned by digest.
  imageName: registry.access.redhat.com/hi/postgresql:18.6@sha256:d6cfb70eb81d7843ead5e516b40ceaff10166f9449cb57ac8bbee33688cb26d3
  # The uid and gid the image names postgres: 999 in this image. CNPG writes
  # the name of its uid into pg_ident, so with another uid the compliance
  # query and evidence.sh find wrong pg_ident lines. Set them when the
  # cluster is created.
  postgresUID: 999
  postgresGID: 999
  storageSize: 1Gi

# Signs the server and replication certificates: an Issuer in the cluster's
# namespace, or a ClusterIssuer.
issuer:
  kind: Issuer
  name: example-ca

# The pod ranges and node tunnel addresses in the NetworkPolicy come from the
# nodes' spec.podCIDR.

# barman-cloud object store for WAL archive and backups.
objectStore:
  destinationPath: s3://example-bucket/
  endpointURL: https://s3.example.com
  credentialsSecret: backup-creds  # keys ACCESS_KEY_ID and ACCESS_SECRET_KEY

# true: bootstrap by restoring the backups of sourceCluster instead of initdb.
recovery:
  enabled: false
  sourceCluster: pg  # cluster name the backups were taken from

# Set in desired.yaml.
replication: {}
databases: []
