name: bench
run-name: "bench: ${{ inputs.scenarios }}"

# Runs only on demand, with the scenarios to run. Builds both images of the
# commit for amd64 and arm64 and pushes them to ghcr as sha-<commit>. Then
# each scenario runs on an ubuntu-24.04 and an ubuntu-24.04-arm runner, each a
# plain docker run of the bench image with samples/ mounted. docs/bench.md
# describes the bench.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to run, separated by spaces, or all
        type: string
        default: switchover

permissions:
  contents: read

env:
  BENCH_IMAGE: ghcr.io/djosh34/cnpg-evidence-bench
  CLIENT_IMAGE: ghcr.io/djosh34/cnpg-evidence-client

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scenarios
        id: plan
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -euo pipefail
          known=$(bash bench/scenarios.sh)
          read -ra wanted <<<"$SCENARIOS"
          if [[ ${wanted[*]} == all ]]; then
            mapfile -t wanted <<<"$known"
          fi
          if ((${#wanted[@]} == 0)); then
            echo "no scenario given" >&2
            exit 1
          fi
          for s in "${wanted[@]}"; do
            if ! grep -qxF -- "$s" <<<"$known"; then
              echo "no scenario $s; the scenarios: $(paste -sd ' ' <<<"$known")" >&2
              exit 1
            fi
          done
          scenarios=$(printf '%s\n' "${wanted[@]}" | sort -u | jq -cRn '[inputs]')
          echo "scenarios=$scenarios" | tee -a "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-24.04
    # One build per commit at a time: a second run waits, then finds the
    # images the first one pushed.
    concurrency:
      group: bench-images-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the bench image's apk add runs under emulation; the rest of both
      # builds runs natively for either architecture.
      - name: A builder for amd64 and arm64
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541 --install arm64
          docker buildx create --use --name bench --driver docker-container
      - name: Log in to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # A rerun on the same commit keeps each image an earlier run tested,
      # since a release tags those. Only "not found" means an image is
      # missing; any other error of the lookup stops the job.
      - name: Build and push both images as sha-<commit>
        run: |
          set -euo pipefail
          tag=sha-$GITHUB_SHA
          missing() {
            local out
            if out=$(docker buildx imagetools inspect "$1" 2>&1); then
              echo "$1 exists; not built again"
              return 1
            fi
            [[ $out == *": not found" ]] || { echo "looking up $1: $out" >&2; exit 1; }
          }
          if missing "$CLIENT_IMAGE:$tag"; then
            docker buildx build --platform linux/amd64,linux/arm64 --file bench/Dockerfile --target client \
              --tag "$CLIENT_IMAGE:$tag" --push .
          fi
          if missing "$BENCH_IMAGE:$tag"; then
            docker buildx build --platform linux/amd64,linux/arm64 --file bench/Dockerfile --target bench \
              --build-arg "CLIENT_IMAGE=$CLIENT_IMAGE:$tag" --tag "$BENCH_IMAGE:$tag" --push .
          fi
      - name: Log out of ghcr
        if: always()
        run: docker logout ghcr.io

  scenario:
    needs: [plan, images]
    name: ${{ matrix.scenario }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          set -euo pipefail
          nproc
          free -m
          df -h /
          docker version --format 'docker {{.Server.Version}}'
          sysctl fs.inotify.max_user_instances
          mkdir "$RUNNER_TEMP/before"
          docker ps -aq | sort >"$RUNNER_TEMP/before/containers"
          docker volume ls -q | sort >"$RUNNER_TEMP/before/volumes"
          docker network ls -q | sort >"$RUNNER_TEMP/before/networks"
      # Pulled without a login: the images are public.
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir results
          docker run --rm --privileged -v "$PWD/samples:/bench:ro" -v "$PWD/results:/results" \
            "$BENCH_IMAGE:sha-$GITHUB_SHA" "$SCENARIO"
      - name: Nothing left behind
        if: always()
        run: |
          set -euo pipefail
          diff "$RUNNER_TEMP/before/containers" <(docker ps -aq | sort)
          diff "$RUNNER_TEMP/before/volumes" <(docker volume ls -q | sort)
          diff "$RUNNER_TEMP/before/networks" <(docker network ls -q | sort)
          echo "no container, volume or network left"
      - name: Timing table
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          for table in results/*/timing.md results/*/pgfallback.md; do
            cat "$table" >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.scenario }}-${{ runner.arch }}
          path: results/
          if-no-files-found: warn

  # Fails when a scenario failed or did not run.
  bench:
    needs: [plan, images, scenario]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every scenario passed
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
          SCENARIOS: ${{ needs.scenario.result }}
        run: |
          set -euo pipefail
          echo "plan: $PLAN, images: $IMAGES, scenarios: $SCENARIOS"
          [[ $PLAN == success && $IMAGES == success && $SCENARIOS == success ]]
