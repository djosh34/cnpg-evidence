# Unit tests of rules.yaml: promtool test rules rules.test.yaml
# The input series carry the labels the scrape adds (namespace, cluster, pod).
rule_files: [rules.yaml]
# Every 5 s, as the writes group of rules.yaml.
evaluation_interval: 5s

tests:
  # pg-1 is the primary, pg-2 and pg-3 stream from it. Nothing fires.
  - name: healthy
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x20'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x20'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x20'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x20'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-3"}', values: '0x20'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x20'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x20'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-2",usename="streaming_replica"}', values: '1000x20'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-3",usename="streaming_replica"}', values: '1000x20'}
      - {series: 'cnpg_replica_lag_seconds{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x20'}
      - {series: 'cnpg_replica_lag_seconds{namespace="databases",cluster="pg",pod="pg-3"}', values: '0x20'}
      - {series: 'cnpg_sync_replication_waiting{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_sync_replication_waiting{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '600x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="databases",cluster="pg",pod="pg-1"}', values: '800x20'}
      - {series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="databases",cluster="pg",pod="pg-1"}', values: '100x20'}
      # A replica does not archive; its archiver numbers do not count.
      - {series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x20'}
      - {series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="databases",cluster="pg",pod="pg-2"}', values: '100x20'}
      - {series: 'kubelet_volume_stats_used_bytes{namespace="databases",persistentvolumeclaim="pg-1",node="node-a"}', values: '50x20'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="databases",persistentvolumeclaim="pg-1",node="node-a"}', values: '100x20'}
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="databases",name="pg-server"}', values: '7776000x20'}
      - {series: 'cnpg_backends_total{namespace="databases",cluster="pg",pod="pg-1",datname="orders",state="active"}', values: '10x20'}
      - {series: 'cnpg_pg_settings_setting{namespace="databases",cluster="pg",pod="pg-1",name="max_connections"}', values: '100x20'}
      - {series: 'cnpg_pg_database_xid_age{namespace="databases",cluster="pg",pod="pg-1",datname="orders"}', values: '1000x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="1",check="unexpected_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="4",check="app_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="3",check="role_attribute"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="1",check="cn_mapping"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="1",check="unexpected_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="4",check="app_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="3",check="role_attribute"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="1",check="cn_mapping"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-3",rule="1",check="unexpected_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-3",rule="4",check="app_role"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-3",rule="3",check="role_attribute"}', values: '0x20'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-3",rule="1",check="cn_mapping"}', values: '0x20'}
    promql_expr_test:
      - expr: cnpg_sample:replica_streaming
        eval_time: 5m
        exp_samples:
          - {labels: 'cnpg_sample:replica_streaming{namespace="databases",cluster="pg",pod="pg-2"}', value: 1}
          - {labels: 'cnpg_sample:replica_streaming{namespace="databases",cluster="pg",pod="pg-3"}', value: 1}
      - expr: cnpg_sample:data_disk_used_ratio
        eval_time: 5m
        exp_samples:
          - {labels: 'cnpg_sample:data_disk_used_ratio{namespace="databases",cluster="pg",pod="pg-1",node="node-a"}', value: 0.5}
    alert_rule_test:
      - {eval_time: 20m, alertname: CNPGDatabaseDown}
      - {eval_time: 20m, alertname: CNPGReplicaDown}
      - {eval_time: 20m, alertname: CNPGReplicaLag}
      - {eval_time: 20m, alertname: CNPGBackupFailing}
      - {eval_time: 20m, alertname: CNPGDataDiskFull}
      - {eval_time: 20m, alertname: CNPGCertificateExpiring}
      - {eval_time: 20m, alertname: CNPGConnectionsHigh}
      - {eval_time: 20m, alertname: CNPGTransactionIDWraparound}
      - {eval_time: 20m, alertname: CNPGComplianceViolation}
      - {eval_time: 20m, alertname: CNPGMetricsMissing}
      - {eval_time: 20m, alertname: CNPGWritesBlocked}

  # PostgreSQL is down on every instance: one alert for the database.
  - name: database down
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x10'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x10'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '0x10'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x10'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x10'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-3"}', values: '0x10'}
    alert_rule_test:
      - {eval_time: 2m, alertname: CNPGDatabaseDown}
      - eval_time: 4m
        alertname: CNPGDatabaseDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: No instance of databases/pg reports a running primary.
              description: PostgreSQL is down or fenced on every instance, no replica was promoted, or the metrics of the primary do not arrive.
      - {eval_time: 10m, alertname: CNPGMetricsMissing}

  # Every instance is fenced. The exporter skips its queries and keeps
  # cnpg_collector_up at 1.
  - name: database fenced
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x10'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x10'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x10'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x10'}
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGDatabaseDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: No instance of databases/pg reports a running primary.
              description: PostgreSQL is down or fenced on every instance, no replica was promoted, or the metrics of the primary do not arrive.
      - {eval_time: 10m, alertname: CNPGMetricsMissing}

  # The instances answer but report none of their query metrics: which one is
  # the primary is not known, so only the metrics alert fires.
  - name: query metrics missing
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x15'}
    alert_rule_test:
      - {eval_time: 11m, alertname: CNPGDatabaseDown}
      - eval_time: 11m
        alertname: CNPGMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-1}
            exp_annotations:
              summary: Metrics of instance pg-1 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2}
            exp_annotations:
              summary: Metrics of instance pg-2 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.

  # No metric of the database arrives at all.
  - name: database down, no metrics
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="other",cluster="other",pod="other-1"}', values: '1x10'}
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGDatabaseDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: No instance of databases/pg reports a running primary.
              description: PostgreSQL is down or fenced on every instance, no replica was promoted, or the metrics of the primary do not arrive.

  # The primary's pod is gone for 2 min until pg-2 is promoted: shorter than
  # the 3 min the alert waits.
  - name: failover
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1 1 stale'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0 0 stale'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x10'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1 1 1 1 0x6'}
    alert_rule_test:
      - {eval_time: 10m, alertname: CNPGDatabaseDown}

  # pg-3's node is down: it is not in the primary's pg_stat_replication and
  # its own metrics are gone.
  - name: replica down
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1 stale'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-2",usename="streaming_replica"}', values: '1000x15'}
    alert_rule_test:
      - {eval_time: 4m, alertname: CNPGReplicaDown}
      - eval_time: 6m
        alertname: CNPGReplicaDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-3}
            exp_annotations:
              summary: Instance pg-3 of databases/pg does not stream from the primary or reports no metrics.
      - {eval_time: 11m, alertname: CNPGDatabaseDown}

  # The primary's node is lost with the collector that scraped it, which
  # sends no stale marker: pg-1's last samples stay for the lookback, 5 min.
  # pg-2 is promoted a minute later. pg-1 counts as down from its newest
  # sample's falling more than 30 s behind the others', at 3m: the alert fires
  # 5 min later, not 5 min after the lookback.
  - name: primary's collector lost with its node
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1 1 1 _x12'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0 0 0 _x12'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1 1 1 0x12'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-2",usename="streaming_replica"}', values: '1000 1000 1000 _x12'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-3",usename="streaming_replica"}', values: '1000 1000 1000 _x12'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-2",application_name="pg-3",usename="streaming_replica"}', values: '_ _ _ 2000x12'}
    promql_expr_test:
      - expr: cnpg_sample:primary
        eval_time: 4m
        exp_samples:
          - {labels: 'cnpg_sample:primary{namespace="databases",cluster="pg",pod="pg-2"}', value: 0}
      - expr: cnpg_sample:replica_streaming
        eval_time: 4m
        exp_samples:
          - {labels: 'cnpg_sample:replica_streaming{namespace="databases",cluster="pg",pod="pg-3"}', value: 1}
    alert_rule_test:
      - {eval_time: 7m30s, alertname: CNPGReplicaDown}
      - eval_time: 8m30s
        alertname: CNPGReplicaDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-1}
            exp_annotations:
              summary: Instance pg-1 of databases/pg does not stream from the primary or reports no metrics.
      - {eval_time: 12m, alertname: CNPGDatabaseDown}

  # A replica streams but its exporter stops answering.
  - name: replica metrics stop
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1 1 stale'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-2",usename="streaming_replica"}', values: '1000x15'}
    alert_rule_test:
      - eval_time: 8m
        alertname: CNPGReplicaDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2}
            exp_annotations:
              summary: Instance pg-2 of databases/pg does not stream from the primary or reports no metrics.

  # pg-3 stops streaming while its exporter still answers: it leaves the
  # primary's pg_stat_replication.
  - name: replica stops streaming, exporter up
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-2",usename="streaming_replica"}', values: '1000x15'}
      - {series: 'cnpg_pg_stat_replication_backend_start{namespace="databases",cluster="pg",pod="pg-1",application_name="pg-3",usename="streaming_replica"}', values: '1000 1000 stale'}
    promql_expr_test:
      - expr: cnpg_sample:replica_streaming
        eval_time: 5m
        exp_samples:
          - {labels: 'cnpg_sample:replica_streaming{namespace="databases",cluster="pg",pod="pg-2"}', value: 1}
    alert_rule_test:
      - {eval_time: 6m, alertname: CNPGReplicaDown}
      - eval_time: 8m
        alertname: CNPGReplicaDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-3}
            exp_annotations:
              summary: Instance pg-3 of databases/pg does not stream from the primary or reports no metrics.

  # pg-3's node is lost and the other instances answer without their query
  # metrics, as CNPG's exporters can while a node is lost. The replica alert
  # holds; Alertmanager mutes the metrics alert under it.
  - name: replica down, no query metrics
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1 stale'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x15'}
    alert_rule_test:
      - eval_time: 11m
        alertname: CNPGReplicaDown
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-3}
            exp_annotations:
              summary: Instance pg-3 of databases/pg does not stream from the primary or reports no metrics.
      - {eval_time: 11m, alertname: CNPGDatabaseDown}
      - eval_time: 11m
        alertname: CNPGMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-1}
            exp_annotations:
              summary: Metrics of instance pg-1 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2}
            exp_annotations:
              summary: Metrics of instance pg-2 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.

  - name: replica lag
    interval: 1m
    input_series:
      - {series: 'cnpg_replica_lag_seconds{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x4 20x10 0x5'}
      - {series: 'cnpg_replica_lag_seconds{namespace="databases",cluster="pg",pod="pg-3"}', values: '15x14'}
    alert_rule_test:
      - {eval_time: 6m, alertname: CNPGReplicaLag}
      - eval_time: 7m
        alertname: CNPGReplicaLag
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2}
            exp_annotations:
              summary: Replica pg-2 of databases/pg is 20s behind the primary.
      - {eval_time: 16m, alertname: CNPGReplicaLag}

  # The last backup ran at 1 h; at 27 h it is older than 26 h.
  - name: backup too old
    interval: 10m
    input_series:
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '3600x200'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x200'}
    alert_rule_test:
      - {eval_time: 26h, alertname: CNPGBackupFailing}
      - eval_time: 28h
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.

  - name: backup failed
    interval: 1m
    input_series:
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '100x14 900x5'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '200x20'}
    alert_rule_test:
      - eval_time: 11m
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.
      - {eval_time: 16m, alertname: CNPGBackupFailing}

  # The plugin reports 0 for 30 min, from 2 h, as after a backup list from
  # the store that missed the backup; an older backup had failed. The newest
  # backup of the last 2 h still counts, so nothing fires. This covers the
  # comparison with the failed backup; the case "backup timestamp 0 for over
  # 2 h" covers the 0 in the age.
  - name: backup timestamp 0 for 30 min
    interval: 5m
    input_series:
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '3600x23 0x5 3600x12'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '1800x40'}
    alert_rule_test:
      - {eval_time: 2h15m, alertname: CNPGBackupFailing}
      - {eval_time: 2h25m, alertname: CNPGBackupFailing}
      - {eval_time: 2h45m, alertname: CNPGBackupFailing}

  # No backup was ever made: the plugin reports 0. It fires once 26 h have
  # passed, here from the start of the test.
  - name: no backup for 26 h
    interval: 10m
    input_series:
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x180'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x180'}
    alert_rule_test:
      - {eval_time: 26h, alertname: CNPGBackupFailing}
      - eval_time: 26h20m
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.

  # A backup at 25 h, then the plugin reports 0 from 28h10m on. Within 2 h
  # that backup still counts; once the 0 lasts longer, it fires.
  - name: backup timestamp 0 for over 2 h
    interval: 10m
    input_series:
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x149 90000x18 0x30'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x199'}
    alert_rule_test:
      - {eval_time: 29h30m, alertname: CNPGBackupFailing}
      - eval_time: 31h
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.

  - name: WAL archiving fails
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '100x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="databases",cluster="pg",pod="pg-1"}', values: '400x20'}
      - {series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="databases",cluster="pg",pod="pg-1"}', values: '400+60x20'}
    alert_rule_test:
      - {eval_time: 9m, alertname: CNPGBackupFailing}
      - eval_time: 11m
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.

  # The backup plugin reports nothing.
  - name: backup metrics missing
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x20'}
    alert_rule_test:
      - eval_time: 11m
        alertname: CNPGBackupFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: Backups of databases/pg fail or are too old.
              description: The last backup is older than 26 h or missing, the last backup failed, or WAL archiving fails.

  # pg-1's disk at 75 % warns; pg-2's at 85 % fires both, and Alertmanager
  # mutes the warning. A WAL volume and a volume of another application do
  # not count.
  - name: data disk full
    interval: 1m
    input_series:
      - {series: 'kubelet_volume_stats_used_bytes{namespace="databases",persistentvolumeclaim="pg-1",node="node-a"}', values: '75x10 50x5'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="databases",persistentvolumeclaim="pg-1",node="node-a"}', values: '100x15'}
      - {series: 'kubelet_volume_stats_used_bytes{namespace="databases",persistentvolumeclaim="pg-2",node="node-b"}', values: '85x10 50x5'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="databases",persistentvolumeclaim="pg-2",node="node-b"}', values: '100x15'}
      - {series: 'kubelet_volume_stats_used_bytes{namespace="databases",persistentvolumeclaim="pg-3-wal",node="node-c"}', values: '95x15'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="databases",persistentvolumeclaim="pg-3-wal",node="node-c"}', values: '100x15'}
      - {series: 'kubelet_volume_stats_used_bytes{namespace="storage",persistentvolumeclaim="data-store-0",node="node-c"}', values: '99x15'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="storage",persistentvolumeclaim="data-store-0",node="node-c"}', values: '100x15'}
    alert_rule_test:
      - {eval_time: 4m, alertname: CNPGDataDiskFull}
      - eval_time: 6m
        alertname: CNPGDataDiskFull
        exp_alerts:
          - exp_labels: {severity: warning, namespace: databases, cluster: pg, pod: pg-1, node: node-a}
            exp_annotations:
              summary: The data disk of instance pg-1 of databases/pg on node node-a is 75% full.
          - exp_labels: {severity: warning, namespace: databases, cluster: pg, pod: pg-2, node: node-b}
            exp_annotations:
              summary: The data disk of instance pg-2 of databases/pg on node node-b is 85% full.
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2, node: node-b}
            exp_annotations:
              summary: The data disk of instance pg-2 of databases/pg on node node-b is 85% full.
      - {eval_time: 12m, alertname: CNPGDataDiskFull}

  # pg-server expires in 10 days, pg-replication in 2 until it is renewed at
  # 30 min. A certificate not yet issued reports 0, and certificates the chart
  # does not make do not count.
  - name: certificates expiring
    interval: 1m
    input_series:
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="databases",name="pg-server"}', values: '864000x40'}
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="databases",name="pg-replication"}', values: '172800x29 7776000x10'}
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="databases",name="pg-restore-server"}', values: '0x40'}
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="clients",name="orders-app"}', values: '86400x40'}
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, namespace: databases, cluster: pg, name: pg-server}
            exp_annotations:
              summary: Certificate databases/pg-server expires in 9d 23h 40m 0s.
          - exp_labels: {severity: warning, namespace: databases, cluster: pg, name: pg-replication}
            exp_annotations:
              summary: Certificate databases/pg-replication expires in 1d 23h 40m 0s.
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, name: pg-replication}
            exp_annotations:
              summary: Certificate databases/pg-replication expires in 1d 23h 40m 0s.
      - eval_time: 35m
        alertname: CNPGCertificateExpiring
        exp_alerts:
          - exp_labels: {severity: warning, namespace: databases, cluster: pg, name: pg-server}
            exp_annotations:
              summary: Certificate databases/pg-server expires in 9d 23h 25m 0s.

  - name: connections high
    interval: 1m
    input_series:
      - {series: 'cnpg_backends_total{namespace="databases",cluster="pg",pod="pg-1",datname="orders",state="active"}', values: '50x10 10x5'}
      - {series: 'cnpg_backends_total{namespace="databases",cluster="pg",pod="pg-1",datname="billing",state="idle"}', values: '45x15'}
      - {series: 'cnpg_pg_settings_setting{namespace="databases",cluster="pg",pod="pg-1",name="max_connections"}', values: '100x15'}
      - {series: 'cnpg_backends_total{namespace="databases",cluster="pg",pod="pg-2",datname="orders",state="active"}', values: '90x10'}
      - {series: 'cnpg_pg_settings_setting{namespace="databases",cluster="pg",pod="pg-2",name="max_connections"}', values: '100x10'}
    alert_rule_test:
      - eval_time: 6m
        alertname: CNPGConnectionsHigh
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-1}
            exp_annotations:
              summary: Instance pg-1 of databases/pg uses 95% of max_connections.
      - {eval_time: 12m, alertname: CNPGConnectionsHigh}

  - name: transaction ID wraparound
    interval: 1m
    input_series:
      - {series: 'cnpg_pg_database_xid_age{namespace="databases",cluster="pg",pod="pg-1",datname="orders"}', values: '1200000000x20 200000000x5'}
      - {series: 'cnpg_pg_database_xid_age{namespace="databases",cluster="pg",pod="pg-1",datname="billing"}', values: '5000x25'}
    alert_rule_test:
      - eval_time: 16m
        alertname: CNPGTransactionIDWraparound
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg}
            exp_annotations:
              summary: The oldest transaction ID of databases/pg is 1.2G transactions old.
              description: Vacuum does not freeze old rows; find the database with the highest cnpg_pg_database_xid_age.
      - {eval_time: 22m, alertname: CNPGTransactionIDWraparound}

  # A new role on the primary reaches every instance: one alert for the check.
  - name: compliance violation
    interval: 1m
    input_series:
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="1",check="unexpected_role"}', values: '0 1x10 0x5'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="1",check="unexpected_role"}', values: '0 1x10 0x5'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="3",check="role_attribute"}', values: '0x10'}
    alert_rule_test:
      - eval_time: 3m
        alertname: CNPGComplianceViolation
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, rule: "1", check: unexpected_role}
            exp_annotations:
              summary: Check unexpected_role of rule 1 fails on databases/pg.
              description: Run evidence.sh against desired.yaml to see which role, attribute or mapping changed.
      - {eval_time: 13m, alertname: CNPGComplianceViolation}

  # pg-2 reports three of the four checks, pg-3 none; pg-1 all four.
  - name: compliance checks missing
    interval: 1m
    input_series:
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-1"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_collector_up{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x15'}
      - {series: 'cnpg_collector_fencing_on{namespace="databases",cluster="pg",pod="pg-3"}', values: '0x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-2"}', values: '1x15'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-3"}', values: '1x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="1",check="unexpected_role"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="4",check="app_role"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="3",check="role_attribute"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-1",rule="1",check="cn_mapping"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="1",check="unexpected_role"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="4",check="app_role"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="3",check="role_attribute"}', values: '0x15'}
      - {series: 'cnpg_compliance_violations{namespace="databases",cluster="pg",pod="pg-2",rule="1",check="cn_mapping"}', values: '_x13 0x2'}
    alert_rule_test:
      - eval_time: 11m
        alertname: CNPGMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-2}
            exp_annotations:
              summary: Metrics of instance pg-2 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-3}
            exp_annotations:
              summary: Metrics of instance pg-3 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.
      - eval_time: 14m
        alertname: CNPGMetricsMissing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-3}
            exp_annotations:
              summary: Metrics of instance pg-3 of databases/pg are missing.
              description: Its exporter answers without the metrics of its queries, or the compliance query fails, for example without its grants.

  # Samples every 5 s, as the exporter is scraped. A statement runs for 15 s
  # and then waits 5 s for its standby, which the query counts only while it
  # waits: no alert. Then commits wait 20 s while no standby confirms them:
  # the alert fires after 10 s and resolves once they go on.
  - name: writes blocked
    interval: 5s
    input_series:
      - {series: 'cnpg_sync_replication_waiting{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x5 1 0x10 2x4 0x6'}
      - {series: 'cnpg_sync_replication_waiting{namespace="databases",cluster="pg",pod="pg-2"}', values: '0x26'}
    alert_rule_test:
      - {eval_time: 30s, alertname: CNPGWritesBlocked}
      - {eval_time: 35s, alertname: CNPGWritesBlocked}
      - {eval_time: 95s, alertname: CNPGWritesBlocked}
      - eval_time: 100s
        alertname: CNPGWritesBlocked
        exp_alerts:
          - exp_labels: {severity: critical, namespace: databases, cluster: pg, pod: pg-1}
            exp_annotations:
              summary: Commits on pg-1 of databases/pg wait for a synchronous standby.
              description: 2 sessions wait for a standby to confirm their commit. Reads still work.
      - {eval_time: 115s, alertname: CNPGWritesBlocked}

  # The primary's collector is lost with its node while its last sample shows
  # a commit waiting. It sends no stale marker, so the sample stays for the
  # lookback: no alert.
  - name: writes blocked, collector lost
    interval: 5s
    input_series:
      - {series: 'cnpg_sync_replication_waiting{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x5 1 _x40'}
    alert_rule_test:
      - {eval_time: 30s, alertname: CNPGWritesBlocked}
      - {eval_time: 45s, alertname: CNPGWritesBlocked}
      - {eval_time: 60s, alertname: CNPGWritesBlocked}
      - {eval_time: 120s, alertname: CNPGWritesBlocked}

  # A cluster that is not listed in cnpg_sample:database gives no alert; the
  # listed one is healthy.
  - name: unlisted cluster
    interval: 1m
    input_series:
      - {series: 'cnpg_pg_replication_in_recovery{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '600x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="databases",cluster="pg",pod="pg-1"}', values: '0x20'}
      - {series: 'cnpg_collector_up{namespace="other",cluster="other",pod="other-1"}', values: '1x20'}
      - {series: 'cnpg_collector_up{namespace="other",cluster="other",pod="other-2"}', values: '1 stale'}
      - {series: 'cnpg_collector_fencing_on{namespace="other",cluster="other",pod="other-1"}', values: '0x20'}
      - {series: 'cnpg_pg_replication_in_recovery{namespace="other",cluster="other",pod="other-1"}', values: '1x20'}
      - {series: 'cnpg_replica_lag_seconds{namespace="other",cluster="other",pod="other-1"}', values: '60x20'}
      - {series: 'cnpg_sync_replication_waiting{namespace="other",cluster="other",pod="other-1"}', values: '3x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="other",cluster="other",pod="other-1"}', values: '100x20'}
      - {series: 'barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="other",cluster="other",pod="other-1"}', values: '200x20'}
      - {series: 'kubelet_volume_stats_used_bytes{namespace="other",persistentvolumeclaim="other-1",node="node-a"}', values: '99x20'}
      - {series: 'kubelet_volume_stats_capacity_bytes{namespace="other",persistentvolumeclaim="other-1",node="node-a"}', values: '100x20'}
      - {series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="other",name="other-server"}', values: '3600x20'}
      - {series: 'cnpg_backends_total{namespace="other",cluster="other",pod="other-1",datname="orders",state="active"}', values: '99x20'}
      - {series: 'cnpg_pg_settings_setting{namespace="other",cluster="other",pod="other-1",name="max_connections"}', values: '100x20'}
      - {series: 'cnpg_pg_database_xid_age{namespace="other",cluster="other",pod="other-1",datname="orders"}', values: '1500000000x20'}
      - {series: 'cnpg_compliance_violations{namespace="other",cluster="other",pod="other-1",rule="1",check="unexpected_role"}', values: '1x20'}
    alert_rule_test:
      - {eval_time: 20m, alertname: CNPGReplicaDown}
      - {eval_time: 20m, alertname: CNPGReplicaLag}
      - {eval_time: 20m, alertname: CNPGBackupFailing}
      - {eval_time: 20m, alertname: CNPGDataDiskFull}
      - {eval_time: 20m, alertname: CNPGCertificateExpiring}
      - {eval_time: 20m, alertname: CNPGConnectionsHigh}
      - {eval_time: 20m, alertname: CNPGTransactionIDWraparound}
      - {eval_time: 20m, alertname: CNPGComplianceViolation}
      - {eval_time: 20m, alertname: CNPGMetricsMissing}
      - {eval_time: 20m, alertname: CNPGWritesBlocked}
