# Every version of the system under test that an e2e run uses, and a values
# file of every release (docs/e2e.md). Written by:
#   go -C e2e run ./cmd/manifest -k3s v1.36.6+k3s1 -cert-manager v1.21.3 -cloudnative-pg 0.29.2 -plugin-barman-cloud 0.9.0 -opentelemetry-collector 0.180.0 -postgresql registry.access.redhat.com/hi/postgresql:18.7-1794620596 -rollout-from registry.access.redhat.com/hi/postgresql:18.6-1793756462

# The k3s release of the nodes. Before k3s starts, each node gets the airgap
# tarball of its architecture, and k3s imports its images: those of the
# release's k3s-images.txt.
k3s:
  version: "v1.36.6+k3s1"
  image: rancher/k3s:v1.36.6-k3s1@sha256:88d3fac10eb4a429d3c5275f4868fe4b13620f6bbca5bdb5dca0627ac76ae2a0
  airgap:
    amd64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s-airgap-images-amd64.tar.zst
      sha256: b3029b1a682b8597587e89f5b1c48493e579a6ea1d0ec6a9aac718a8c356e5be
    arm64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.36.6%2Bk3s1/k3s-airgap-images-arm64.tar.zst
      sha256: 881b93edba1b9d91cb0a4ea09ca08298d0f22ec9442ce9a80e697da97945532c
  images:
    - docker.io/rancher/klipper-helm:v0.13.3-build20261021
    - docker.io/rancher/klipper-lb:v0.4.17
    - docker.io/rancher/local-path-provisioner:v0.0.37
    - docker.io/rancher/mirrored-coredns-coredns:1.14.7
    - docker.io/rancher/mirrored-library-busybox:1.37.0
    - docker.io/rancher/mirrored-library-traefik:3.7.15
    - docker.io/rancher/mirrored-metrics-server:v0.9.0
    - docker.io/rancher/mirrored-pause:3.10.2

# The tools of the e2e image that have to match the cluster: kubectl of the
# k3s release's Kubernetes version, kubectl-cnpg of the operator's version,
# and k3s's script that makes new CAs, of the k3s release.
tools:
  kubectl:
    version: "v1.36.6"
    sha256:
      amd64: 29818b6729dc9262b692307470d0558d027725e738be5dd47c760261868a2634
      arm64: 35507ef408c3d38849e5d3203e18f8e861db822aa664101a9ced0869edd06046
  kubectl-cnpg:
    version: "1.30.2"
    sha256:
      amd64: a926584a2506f2beff624af03d22eb742d6227e259e364e603ea2f88a791a507
      arm64: 2882241ec1e2ba8ed32a7a3735de278adb34349b570729b8bb867eedc1f57e64
  rotate-default-ca-certs.sh:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.36.6%2Bk3s1/contrib/util/rotate-default-ca-certs.sh
    sha256: 62ef79f530cd285b3cfce884746abe6c3712ad70d0ef66e81f76aaa93c30551b

# The upstream charts. The run writes each into the dependency of its
# wrapper chart, and helm dependency build pulls it.
charts:
  cert-manager:
    repository: https://charts.jetstack.io
    version: "v1.21.3"
  cloudnative-pg:
    repository: https://cloudnative-pg.github.io/charts
    version: "0.29.2"
  opentelemetry-collector:
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: "0.180.0"
  plugin-barman-cloud:
    repository: https://cloudnative-pg.github.io/charts
    version: "0.9.0"

# The instance images, which the cnpg-cluster charts read. The rollout
# scenario starts on rolloutFrom and rolls out to imageName.
postgresql:
  imageName: registry.access.redhat.com/hi/postgresql:18.7-1794620596@sha256:950367fbec54066d458a7d2eef5f84b6d6810505a26971fc19fd64f2ae11adca
  rolloutFrom: registry.access.redhat.com/hi/postgresql:18.6-1793756462@sha256:a448becd1c47f4c525c7d7123fb8fc735c718d1e75f113ca7a933afadddd2e83

