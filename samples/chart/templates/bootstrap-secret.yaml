{{- $c := .Values.cluster }}
# Placeholder named in bootstrap.secret. initdb reads username from it, and the
# empty password leaves postgres with no password.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}-bootstrap
  namespace: {{ $c.namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: ""
