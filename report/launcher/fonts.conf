<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts Chrome may use: those in the payload. Every path here is
     read below FONTCONFIG_SYSROOT, the unpacked payload. -->
<fontconfig>
  <dir>/page/fonts</dir>
  <cachedir>/cache/fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Sofia Sans</family></prefer>
  </alias>
</fontconfig>
