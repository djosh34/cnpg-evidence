name: e2e

# Runs on demand: every scenario of samples/features on amd64 and on arm64,
# each in its own job with ./e2e.sh, on the settings of samples/ or of the
# variant given. Each job uploads the run's files, also when the scenario
# failed. A Go test of e2e/ checks that the list below has every scenario,
# and that the list a variant run leaves out is notInVariants of
# e2e/main.go.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: A directory of variants/; empty for the samples
        type: string
        default: ""

run-name: e2e of ${{ inputs.variant || 'the samples' }}

permissions:
  contents: read

jobs:
  scenario:
    name: ${{ matrix.scenario }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario:
          - backup-restore
          - evidence
          - exporter-node-loss
          - fence
          - host-check
          - lag-after-primary-change
          - lag-and-stall
          - one-node-left
          - pgfallback-drain
          - pgfallback-primary-node-loss
          - pgfallback-replica-node-loss
          - primary-node-loss
          - quiet-failover
          - quiet-rewind
          - rejoin-from-archive
          - replica-down-long
          - replica-node-loss
          - replica-not-streaming
          - replica-restart-during-primary-loss
          - rollout
          - store-hang
          - store-refuse
          - switchover
        exclude: ${{ fromJSON(inputs.variant && '[{"scenario":"pgfallback-drain"},{"scenario":"pgfallback-primary-node-loss"},{"scenario":"pgfallback-replica-node-loss"},{"scenario":"rejoin-from-archive"}]' || '[]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - name: Scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
          VARIANT: ${{ inputs.variant }}
        run: ./e2e.sh "$SCENARIO" "$VARIANT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.scenario }}-${{ runner.arch }}
          path: results/
          if-no-files-found: warn
