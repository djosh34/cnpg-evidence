{{- $c := .Values.cluster }}
{{- $replicationCN := required "replication.commonName is required" .Values.replication.commonName }}
# The custom queries that CNPG's metrics exporter runs on every instance, as
# cnpg_metrics_exporter (docs/samples.md, docs/monitoring.md):
# - compliance: cnpg_compliance_violations{rule, check}, per check the number
#   of roles, attributes or pg_ident lines that break it, 0 when it passes. The
#   expected values come from samples/desired.yaml and CNPG's fixed roles and lines,
#   as in scripts/evidence/violations/expected.jq.
# - replica: cnpg_replica_lag_seconds, on replicas only.
# - sync_replication: cnpg_sync_replication_waiting.
#
# A Secret, not a ConfigMap: with a Secret listed in customQueriesSecret,
# CNPG 1.30.1 does not rewrite the Cluster status in a loop while a pod is
# being deleted. That loop makes every instance's exporter answer without its
# query metrics until the pod is gone.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}-queries
  namespace: {{ $c.namespace }}
  labels:
    cnpg.io/reload: ""  # the instances load a changed query without a restart
stringData:
  queries: |
    compliance:
      query: |
        WITH expected_roles(name) AS (
          VALUES ('postgres'), ('streaming_replica'), ('cnpg_metrics_exporter')
          {{- range .Values.databases }}, ('{{ .role | replace "'" "''" }}'){{ end }}
        ),
        -- The roles that may hold each attribute: CNPG's postgres and streaming_replica.
        allowed_attributes(attribute, name) AS (
          VALUES ('superuser', 'postgres'), ('createrole', 'postgres'), ('createdb', 'postgres'),
                 ('replication', 'postgres'), ('replication', 'streaming_replica'), ('bypassrls', 'postgres'),
                 ('pg_read_server_files', 'postgres'), ('pg_write_server_files', 'postgres'),
                 ('pg_execute_server_program', 'postgres'), ('pg_read_all_data', 'postgres')
        ),
        -- CNPG's fixed lines, then the lines of cluster.yaml.
        expected_ident(map, cn, role) AS (
          VALUES ('local', 'postgres', 'postgres'),
                 ('cnpg_streaming_replica', 'streaming_replica', 'streaming_replica'),
                 ('cnpg_pooler_pgbouncer', 'cnpg_pooler_pgbouncer', 'cnpg_pooler_pgbouncer'),
                 ('cnpg_metrics_exporter', 'postgres', 'cnpg_metrics_exporter'),
                 ('cnpg_streaming_replica', '{{ $replicationCN | replace "'" "''" }}', 'streaming_replica')
                 {{- range .Values.databases }}
                 {{- $role := .role }}
                 {{- range .clientCNs }},
                 ('clients', '{{ . | replace "'" "''" }}', '{{ $role | replace "'" "''" }}')
                 {{- end }}
                 {{- end }}
        ),
        roles AS (
          SELECT rolname AS name FROM pg_roles WHERE rolname !~ '^pg_'
        ),
        -- An attribute counts when the role can SET ROLE to a role that has it.
        -- Membership in a predefined role that reads or writes the server's
        -- files, runs programs on it or reads all data counts as an attribute
        -- too, by SET ROLE or inheritance.
        attributes AS (
          SELECT DISTINCT member.rolname AS name, a.attribute
          FROM pg_roles member
          JOIN pg_roles target ON pg_has_role(member.oid, target.oid, 'SET')
          CROSS JOIN LATERAL (VALUES ('superuser', target.rolsuper), ('createrole', target.rolcreaterole),
                                     ('createdb', target.rolcreatedb), ('replication', target.rolreplication),
                                     ('bypassrls', target.rolbypassrls)) a(attribute, held)
          WHERE member.rolname !~ '^pg_' AND a.held
          UNION
          SELECT member.rolname, target.rolname
          FROM pg_roles member
          JOIN pg_roles target ON pg_has_role(member.oid, target.oid, 'SET') OR pg_has_role(member.oid, target.oid, 'USAGE')
          WHERE member.rolname !~ '^pg_'
            AND target.rolname IN ('pg_read_server_files', 'pg_write_server_files', 'pg_execute_server_program', 'pg_read_all_data')
        ),
        ident AS (
          SELECT map_name AS map, sys_name AS cn, pg_username AS role, error FROM pg_ident_file_mappings
        )
        SELECT '1' AS rule, 'unexpected_role' AS check, count(*) AS violations
          FROM roles WHERE name <> 'app' AND name NOT IN (SELECT name FROM expected_roles)
        UNION ALL
        SELECT '4', 'app_role', count(*) FROM roles WHERE name = 'app'
        UNION ALL
        SELECT '3', 'role_attribute', count(*)
          FROM attributes WHERE (attribute, name) NOT IN (SELECT attribute, name FROM allowed_attributes)
        UNION ALL
        -- Every line that is not expected or has an error, and every expected line that is missing.
        SELECT '1', 'cn_mapping',
          (SELECT count(*) FROM ident i
           WHERE i.error IS NOT NULL
              OR NOT EXISTS (SELECT 1 FROM expected_ident e WHERE (e.map, e.cn, e.role) = (i.map, i.cn, i.role)))
          + (SELECT count(*) FROM expected_ident e
             WHERE NOT EXISTS (SELECT 1 FROM ident i WHERE (i.map, i.cn, i.role) = (e.map, e.cn, e.role)))
      metrics:
        - rule:
            usage: LABEL
            description: The rule of evidence.sh the check belongs to
        - check:
            usage: LABEL
            description: The name of the check
        - violations:
            usage: GAUGE
            description: Roles, attributes or pg_ident lines that break the check on this instance, 0 when it passes
    replica:
      # How far behind this replica's reads are: 0 when it has replayed all the
      # WAL its primary last reported, else the age of the last transaction it
      # replayed. Also the age while no WAL receiver runs. CNPG's
      # cnpg_pg_replication_lag compares with the received WAL instead, which
      # after a restart of PostgreSQL stays behind until the primary writes
      # again, and so reports minutes on a replica that is caught up.
      query: |
        SELECT CASE WHEN r.latest_end_lsn <= pg_last_wal_replay_lsn() THEN 0
                    ELSE coalesce(greatest(0, extract(epoch FROM now() - pg_last_xact_replay_timestamp())), 0)
               END AS lag_seconds
        FROM (SELECT 1) one
        LEFT JOIN pg_stat_wal_receiver r ON true
        WHERE pg_is_in_recovery()
      metrics:
        - lag_seconds:
            usage: GAUGE
            description: 0 when the replica has replayed all the WAL its primary reported, else the age of the last transaction it replayed, in seconds
    sync_replication:
      # Sessions waiting right now for a standby to confirm their commit.
      query: |
        SELECT count(*) AS waiting FROM pg_stat_activity WHERE wait_event = 'SyncRep'
      metrics:
        - waiting:
            usage: GAUGE
            description: Sessions waiting for a synchronous standby to confirm their commit
