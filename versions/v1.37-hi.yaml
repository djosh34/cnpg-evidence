# Every version of the system under test that an e2e run uses, and a values
# file of every release (docs/e2e.md). k3s and the tools are those of
# v1.37.yaml. Every chart and every image the charts and the cluster run
# come from the mirror ghcr.io/djosh34/hardened-mirror: hardened builds,
# each pinned by digest. Written by hand from v1.37.yaml.

# The k3s release of the nodes. Before k3s starts, each node gets the airgap
# tarball of its architecture, and k3s imports its images: those of the
# release's k3s-images.txt.
k3s:
  version: "v1.37.2+k3s1"
  image: rancher/k3s:v1.37.2-k3s1@sha256:21ea6e0fac4e3930c2ce8aa40ddd41a8b18cb3e9a0222c030dc005e7e88c4332
  airgap:
    amd64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s-airgap-images-amd64.tar.zst
      sha256: 35a5af1e69b57b8b627a4f6b1c29ea104209b661067b8c97fd40dc3f860bfcd2
    arm64:
      url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s-airgap-images-arm64.tar.zst
      sha256: ca384f1a77aa83024bd82ad26fa4774971adb038e656a3b5b9af926be445a442
  images:
    - docker.io/rancher/klipper-helm:v0.13.3-build20261021
    - docker.io/rancher/klipper-lb:v0.4.17
    - docker.io/rancher/local-path-provisioner:v0.0.37
    - docker.io/rancher/mirrored-coredns-coredns:1.14.7
    - docker.io/rancher/mirrored-library-busybox:1.37.0
    - docker.io/rancher/mirrored-library-traefik:3.7.15
    - docker.io/rancher/mirrored-metrics-server:v0.9.0
    - docker.io/rancher/mirrored-pause:3.10.2

# The tools of the e2e image that have to match the cluster: kubectl of the
# k3s release's Kubernetes version, kubectl-cnpg of the operator's version,
# and k3s's script that makes new CAs, of the k3s release.
tools:
  kubectl:
    version: "v1.37.2"
    sha256:
      amd64: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
      arm64: fcc16f63186659d9722014b7e02d5fdd2d4e669cb8c0ab66365d7d3b8ba03509
  kubectl-cnpg:
    version: "1.30.2"
    sha256:
      amd64: a926584a2506f2beff624af03d22eb742d6227e259e364e603ea2f88a791a507
      arm64: 2882241ec1e2ba8ed32a7a3735de278adb34349b570729b8bb867eedc1f57e64
  rotate-default-ca-certs.sh:
    url: https://raw.githubusercontent.com/k3s-io/k3s/v1.37.2%2Bk3s1/contrib/util/rotate-default-ca-certs.sh
    sha256: 62ef79f530cd285b3cfce884746abe6c3712ad70d0ef66e81f76aaa93c30551b

# The mirror's charts, as OCI charts. The run writes each into the dependency
# of its wrapper chart, and helm dependency build pulls it. name is the
# mirror's chart, and alias the wrapper's dependency name, under which its
# values stay.
charts:
  cert-manager:
    name: cert-manager-chart
    alias: cert-manager
    repository: oci://ghcr.io/djosh34/hardened-mirror
    version: "1.21.3"
  cloudnative-pg:
    name: cloudnative-pg-chart
    alias: cloudnative-pg
    repository: oci://ghcr.io/djosh34/hardened-mirror
    version: "0.29.2"
  opentelemetry-collector:
    name: opentelemetry-collector-chart
    alias: opentelemetry-collector
    repository: oci://ghcr.io/djosh34/hardened-mirror
    version: "0.180.0"
  plugin-barman-cloud:
    name: plugin-barman-cloud
    alias: plugin-barman-cloud
    repository: oci://ghcr.io/djosh34/hardened-mirror
    version: "0.9.0"

# The instance images, which the cnpg-cluster charts read. The rollout
# scenario starts on rolloutFrom, an older build, and rolls out to
# imageName. Both name postgres 70, so the cluster gets that uid and gid.
postgresql:
  imageName: ghcr.io/djosh34/hardened-mirror/postgres:18.7-debian13@sha256:3fc42f4f36adcc9de711ddd1750c715c960fb842c0947ff3b2cf53f70dff30ad
  rolloutFrom: ghcr.io/djosh34/hardened-mirror/postgres:18.6-debian13@sha256:a52ca74a5c7da183e0fb7e089d666375d8916855df375268ccb4ed691c85746c
  postgresUID: 70
  postgresGID: 70

# The images of the charts, each under its wrapper chart's dependency name
# and in the chart's own values, pinned by digest. The mirror's charts
# default to the registry dhi.io, so each block that has registry sets it.
cert-manager:
  image:
    registry: ghcr.io
    repository: djosh34/hardened-mirror/cert-manager-controller
    tag: "1.21.3"
    digest: sha256:dad9f8636023c102c32a2fb62a3131130b2c0fafd8cb094b395460150b0f166d
  webhook:
    image:
      registry: ghcr.io
      repository: djosh34/hardened-mirror/cert-manager-webhook
      tag: "1.21.3"
      digest: sha256:07e4ad92c80bda3dcccfded6e5c8b26493a2e744688eec6845a2568ba3453bf3
  cainjector:
    image:
      registry: ghcr.io
      repository: djosh34/hardened-mirror/cert-manager-cainjector
      tag: "1.21.3"
      digest: sha256:42c67a058c213679709cce46a73e5b19289669d063ff4c8ad1f2101ae3d2e395
  acmesolver:
    image:
      registry: ghcr.io
      repository: djosh34/hardened-mirror/cert-manager-acmesolver
      tag: "1.21.3"
      digest: sha256:6aa6c613c67bf7dbe5f9552f03ef5cedcbdd9b900451a35771874ca65ecd5554
  startupapicheck:
    image:
      registry: ghcr.io
      repository: djosh34/hardened-mirror/cert-manager-startupapicheck
      tag: "1.21.3"
      digest: sha256:011e1f71407a66bb08d4a4d4196920c4f699c086abc50318379230256de9830a

# The chart has no digest field, so the digest is in the tag.
cloudnative-pg:
  image:
    repository: ghcr.io/djosh34/hardened-mirror/cloudnative-pg
    tag: "1.30.2@sha256:c895d00f76fbeeb96d2ac1194232b7466f1c6c0fade24e5b7e0efd8133d2b2f0"

# The sidecar is the -dev build: barman-cloud-restore extracts a backup with
# the tar program, which only that build has. The plain build restores
# nothing.
plugin-barman-cloud:
  image:
    registry: ghcr.io
    repository: djosh34/hardened-mirror/cloudnative-pg-plugin-barman-cloud
    tag: "0.16.0@sha256:86b9fbbcfb167330250330852726776a9f30085634aad7dd2c4e00c3f6fd627e"
  sidecarImage:
    registry: ghcr.io
    repository: djosh34/hardened-mirror/cloudnative-pg-plugin-barman-cloud-sidecar
    tag: "0.16.0-dev@sha256:d6a8d1b02c4b4606c45f85bf0d7f0bf01306ba66b22db336bef60f24142579bf"

# The two collectors of the cnpg-opentelemetry-collector chart, both the
# opentelemetry-collector chart, on the mirror's contrib build. The wrapper
# starts otelcol-k8s, which this image does not have: an empty command.name
# leaves the command out, so the image's own entrypoint, otelcol-contrib,
# runs.
agent:
  command:
    name: ""
  image:
    repository: ghcr.io/djosh34/hardened-mirror/opentelemetry-collector
    tag: "0.165.0-contrib"
    digest: sha256:a04581d763bbe7aa108e071e154f5bc31ecd508fa448233a4367a276940eada6
cluster:
  command:
    name: ""
  image:
    repository: ghcr.io/djosh34/hardened-mirror/opentelemetry-collector
    tag: "0.165.0-contrib"
    digest: sha256:a04581d763bbe7aa108e071e154f5bc31ecd508fa448233a4367a276940eada6
